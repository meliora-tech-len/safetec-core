services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env.production
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - logo_storage:/app/static/logos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  logo_storage:
